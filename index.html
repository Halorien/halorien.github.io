<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahjong Hand Renderer</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --border: #333;
      --btn-hover: #3a3a3a;
      --accent: #8ab4f8;
      --ok: #7ee787;
      --err: #ff6b6b;
      --tooltip-bg: rgba(0, 0, 0, 0.85);
      --tooltip-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h2 { margin: 0 0 10px 0; font-weight: 600; }

    textarea, button {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    textarea {
      width: 920px;
      max-width: 100%;
      height: 76px;
      padding: 8px;
      resize: vertical;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
      user-select: none;
    }

    button:hover { background: var(--btn-hover); }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .legend {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95em;
      line-height: 1.4;
    }

    code {
      background: #1b1b1b;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent);
    }

    canvas {
      display: block;
      margin-top: 14px;
      border: 1px solid var(--border);
      background: transparent;
    }

    .err {
      color: var(--err);
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .ok {
      color: var(--ok);
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .spacer { flex: 1 1 auto; }

    footer {
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-left { white-space: nowrap; }

    .footer-logos {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Tooltip wrapper */
    .tip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tip img {
      height: 22px;
      width: auto;
      opacity: 0.92;
      display: none; /* becomes visible only if it loads */
    }

    .tip a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 6px;
    }

    .tip a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tip:hover img { opacity: 1; }

    /* Tooltip bubble */
    .tip::after {
      content: attr(data-tip);
      position: absolute;
      right: 0;
      bottom: 125%;
      transform: translateY(4px);
      background: var(--tooltip-bg);
      border: 1px solid var(--tooltip-border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }

    .tip:hover::after,
    .tip:focus-within::after {
      opacity: 1;
      transform: translateY(0px);
    }

    /* Little tooltip arrow */
    .tip::before {
      content: "";
      position: absolute;
      right: 12px;
      bottom: calc(125% - 6px);
      width: 10px;
      height: 10px;
      background: var(--tooltip-bg);
      border-left: 1px solid var(--tooltip-border);
      border-bottom: 1px solid var(--tooltip-border);
      transform: rotate(45deg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .tip:hover::before,
    .tip:focus-within::before {
      opacity: 1;
    }
  </style>
</head>

<body>
  <h2>Mahjong Hand Renderer</h2>

  <div class="row">
    <textarea id="hand" spellcheck="false">111m234s678p1177z</textarea>
    <div class="row">
      <button id="render">Render</button>
      <button id="copy">Copy image</button>
      <button id="export">Export PNG</button>
    </div>
  </div>

  <div class="legend">
    <b>Compact:</b> <code id="compactOut">111m234s678p1177z</code><br>
    (m = characters, p = circles, s = bamboo)<br>
    (0 = red five, z = honors, b = back)<br>
    (1 = East, 2 = South, 3 = West, 4 = North, 5 = White, 6 = Green, 7 = Red)
  </div>

  <div id="err" class="err"></div>
  <div id="ok" class="ok"></div>
  <canvas id="cv"></canvas>

  <div class="spacer"></div>

  <footer>
    <div class="footer-left">Made by Brendan Spence (Halorien) of The Yakumen</div>

    <div class="footer-logos" aria-label="The Yakumen chapters">
      <span class="tip" data-tip="Yakumen – Chicago Chapter">
        <a href="https://linktr.ee/theyakumen" target="_blank" rel="noopener noreferrer" aria-label="Yakumen – Chicago Chapter (opens in new tab)">
          <img id="logoChi" src="yakumen-chicago.png" alt="Yakumen – Chicago Chapter logo" />
        </a>
      </span>

      <span class="tip" data-tip="Yakumen – Springfield Chapter">
        <img id="logoSpr" src="yakumen-springfield.png" alt="Yakumen – Springfield Chapter logo" />
      </span>
    </div>
  </footer>

<script>
(() => {
  const GAP = 0;
  const GROUP_GAP = 18;
  const TILE_DIR = "tiles";

  const errEl = document.getElementById("err");
  const okEl = document.getElementById("ok");
  const compactEl = document.getElementById("compactOut");
  const handEl = document.getElementById("hand");

  const logoChi = document.getElementById("logoChi");
  const logoSpr = document.getElementById("logoSpr");

  function showErr(msg) { errEl.textContent = msg || ""; }
  function showOk(msg) { okEl.textContent = msg || ""; }
  function setCompact(text) { compactEl.textContent = text || ""; }
  function uniq(arr) { return [...new Set(arr)]; }

  // Show each logo only if it successfully loads
  function wireLogo(imgEl) {
    imgEl.addEventListener("load", () => { imgEl.style.display = "inline-block"; });
    imgEl.addEventListener("error", () => { imgEl.style.display = "none"; });
  }
  wireLogo(logoChi);
  wireLogo(logoSpr);

  function normalizeToken(tok) {
    if (!tok) return null;
    const t = tok.toLowerCase();

    if (t === "b") return "b";
    if (/^[0-9][mps]$/.test(t)) return t;   // 0 = red five
    if (/^[1-7]z$/.test(t)) return t;

    return null;
  }

  // Parser:
  // - No automatic suit gaps
  // - '|' works for both tokenized and compact chunks
  function parseHand(input) {
    const raw = input.trim().toLowerCase();
    if (!raw) return [];

    function compactToTiles(str) {
      const s = str.trim().toLowerCase();
      const out = [];
      let i = 0;

      while (i < s.length) {
        if (s[i] === "b") {
          out.push("b");
          i += 1;
          continue;
        }

        let digits = "";
        while (i < s.length && /[0-9]/.test(s[i])) digits += s[i++];

        if (!digits) throw new Error("Invalid compact format near: " + s.slice(i));

        const suit = s[i++];
        if (!suit || !/[mpsz]/.test(suit)) throw new Error("Missing/invalid suit after digits: " + digits);

        for (const d of digits) {
          const k = normalizeToken(d + suit);
          if (!k) throw new Error("Invalid tile: " + (d + suit));
          out.push(k);
        }
      }
      return out;
    }

    if (raw.includes("|")) {
      const parts = raw.split("|").map(p => p.trim()).filter(Boolean);
      return parts.map(part => {
        if (part.includes(" ")) {
          return { tiles: part.split(/\s+/).map(normalizeToken).filter(Boolean) };
        }
        return { tiles: compactToTiles(part) };
      });
    }

    if (raw.includes(" ")) {
      return [{
        tiles: raw.split(/\s+/).map(normalizeToken).filter(Boolean)
      }];
    }

    return [{
      tiles: compactToTiles(raw)
    }];
  }

  // Canonical compact string for the legend (preserves pipes as " | ").
  function tilesToCompact(groups) {
    function encodeGroup(tiles) {
      let out = "";
      let currentSuit = null;
      let digits = "";

      function flush() {
        if (digits && currentSuit) out += digits + currentSuit;
        digits = "";
        currentSuit = null;
      }

      for (const t of tiles) {
        if (t === "b") {
          flush();
          out += "b";
          continue;
        }
        const digit = t[0];
        const suit = t[1]; // m/p/s/z
        if (currentSuit === suit) digits += digit;
        else { flush(); currentSuit = suit; digits = digit; }
      }
      flush();
      return out;
    }

    return groups.map(g => encodeGroup(g.tiles)).join(" | ");
  }

  // URL helpers
  function getHandFromURL() {
    const params = new URLSearchParams(window.location.search);
    const h = params.get("hand");
    if (!h) return null;
    return h.replace(/\+/g, " ");
  }

  function setURLHand(handString) {
    const url = new URL(window.location.href);
    url.searchParams.set("hand", handString);
    history.replaceState(null, "", url);
  }

  const cache = new Map();

  function loadTile(key) {
    if (cache.has(key)) return Promise.resolve(cache.get(key));

    const img = new Image();
    img.decoding = "async";
    img.src = `${TILE_DIR}/${key}.png`;

    return new Promise((resolve, reject) => {
      img.onload = () => { cache.set(key, img); resolve(img); };
      img.onerror = () => reject(new Error(`Failed to load: ${img.src}`));
    });
  }

  async function render({ updateURL = true } = {}) {
    showErr("");
    showOk("");

    let groups;
    try {
      groups = parseHand(handEl.value);
    } catch (e) {
      showErr(e.message);
      return;
    }
    if (!groups.length) return;

    const compact = tilesToCompact(groups);
    setCompact(compact);

    if (updateURL) {
      // For the URL, keep it compact (no spaces around pipes)
      const urlCompact = compact.replace(/\s\|\s/g, "|");
      setURLHand(urlCompact);
    }

    // Flatten for drawing + explicit group separators
    const flat = [];
    for (let gi = 0; gi < groups.length; gi++) {
      for (const k of groups[gi].tiles) flat.push({ k, sep: false });
      if (gi < groups.length - 1) flat.push({ k: null, sep: true });
    }

    const keys = uniq(flat.filter(x => x.k).map(x => x.k));

    try {
      await Promise.all(keys.map(loadTile));
    } catch (e) {
      showErr(e.message);
      return;
    }

    // Canvas height = tallest tile
    let canvasH = 1;
    for (const k of keys) {
      const img = cache.get(k);
      const h = img.naturalHeight || img.height;
      if (h > canvasH) canvasH = h;
    }

    // Canvas width = sum native widths + separators
    let totalW = 0;
    for (const item of flat) {
      if (item.sep) totalW += GROUP_GAP;
      else {
        const img = cache.get(item.k);
        totalW += (img.naturalWidth || img.width) + GAP;
      }
    }
    if (totalW > 0) totalW -= GAP;

    const cv = document.getElementById("cv");
    cv.width = Math.max(1, totalW);
    cv.height = canvasH;

    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);

    // Draw native-size tiles, bottom-aligned
    let x = 0;
    for (const item of flat) {
      if (item.sep) { x += GROUP_GAP; continue; }
      const img = cache.get(item.k);
      const h = img.naturalHeight || img.height;
      ctx.drawImage(img, x, canvasH - h);
      x += (img.naturalWidth || img.width) + GAP;
    }
  }

  function exportPNG() {
    showErr("");
    showOk("");
    const cv = document.getElementById("cv");
    const a = document.createElement("a");
    a.download = "hand.png";
    a.href = cv.toDataURL("image/png");
    a.click();
    showOk("Downloaded hand.png");
  }

  async function copyImage() {
    showErr("");
    showOk("");

    if (!navigator.clipboard || !window.ClipboardItem) {
      showErr("Copy image isn't supported in this browser. (Chrome/Edge recommended.)");
      return;
    }

    const cv = document.getElementById("cv");

    try {
      const blob = await new Promise(resolve => cv.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("Could not create PNG blob.");

      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      showOk("Copied image to clipboard. Paste into Discord (Ctrl+V).");
    } catch (e) {
      showErr("Copy failed.\n\n" + (e?.message || e));
    }
  }

  document.getElementById("render").addEventListener("click", () => render({ updateURL: true }));
  document.getElementById("export").addEventListener("click", exportPNG);
  document.getElementById("copy").addEventListener("click", copyImage);

  // On load: if URL has ?hand=..., prefill and render it.
  const urlHand = getHandFromURL();
  if (urlHand) {
    handEl.value = urlHand;
    render({ updateURL: false });
  } else {
    render({ updateURL: false });
  }
})();
</script>
</body>
</html>
