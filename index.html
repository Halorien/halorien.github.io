<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahjong Hand Renderer</title>

  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --border: #333;
      --btn-hover: #3a3a3a;
      --accent: #8ab4f8;
      --ok: #7ee787;
      --err: #ff6b6b;
      --tooltip-bg: rgba(0, 0, 0, 0.85);
      --tooltip-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin: 0 0 10px 0;
      font-weight: 600;
    }

    textarea, button {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    textarea {
      width: 920px;
      max-width: 100%;
      height: 76px;
      padding: 8px;
      resize: vertical;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
      user-select: none;
    }

    button:hover {
      background: var(--btn-hover);
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .legend {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95em;
      line-height: 1.4;
    }

    code {
      background: #1b1b1b;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent);
    }

    canvas {
      display: block;
      margin-top: 14px;
      border: 1px solid var(--border);
      background: transparent;
    }

    .err {
      color: var(--err);
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .ok {
      color: var(--ok);
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .spacer { flex: 1 1 auto; }

    footer {
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-left {
      white-space: nowrap;
    }

    .footer-logos {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Tooltip wrapper */
    .tip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tip img {
      height: 22px;
      width: auto;
      opacity: 0.92;
      display: none;
    }

    .tip a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 6px;
    }

    .tip:hover img { opacity: 1; }

    .tip::after {
      content: attr(data-tip);
      position: absolute;
      right: 0;
      bottom: 125%;
      transform: translateY(4px);
      background: var(--tooltip-bg);
      border: 1px solid var(--tooltip-border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }

    .tip::before {
      content: "";
      position: absolute;
      right: 12px;
      bottom: calc(125% - 6px);
      width: 10px;
      height: 10px;
      background: var(--tooltip-bg);
      border-left: 1px solid var(--tooltip-border);
      border-bottom: 1px solid var(--tooltip-border);
      transform: rotate(45deg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .tip:hover::after,
    .tip:hover::before {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <h2>Mahjong Hand Renderer</h2>

  <div class="row">
    <textarea id="hand" spellcheck="false">111m234s678p1177z</textarea>
    <div class="row">
      <button id="render">Render</button>
      <button id="copy">Copy image</button>
      <button id="export">Export PNG</button>
    </div>
  </div>

  <div class="legend">
    <b>Compact:</b> <code id="compactOut">111m234s678p1177z</code><br>
    (m = characters, p = circles, s = bamboo)<br>
    (0 = red five, z = honors, b = back, | = gaps)<br>
    (1 = East, 2 = South, 3 = West, 4 = North, 5 = White, 6 = Green, 7 = Red)
  </div>

  <div id="err" class="err"></div>
  <div id="ok" class="ok"></div>
  <canvas id="cv"></canvas>

  <div class="spacer"></div>

  <footer>
    <div class="footer-left">
      Made by Brendan Spence (Halorien) of The Yakumen
    </div>

    <div class="footer-logos">
      <span class="tip" data-tip="Yakumen – Chicago Chapter">
        <a href="https://linktr.ee/theyakumen" target="_blank" rel="noopener">
          <img id="logoChi" src="yakumen-chicago.png" alt="Yakumen – Chicago Chapter logo">
        </a>
      </span>

      <span class="tip" data-tip="Yakumen – Springfield Chapter">
        <img id="logoSpr" src="yakumen-springfield.png" alt="Yakumen – Springfield Chapter logo">
      </span>
    </div>
  </footer>

<script>
(() => {
  const GAP = 0;
  const GROUP_GAP = 18;
  const TILE_DIR = "tiles";

  const errEl = document.getElementById("err");
  const okEl = document.getElementById("ok");
  const compactEl = document.getElementById("compactOut");
  const handEl = document.getElementById("hand");
  const logoChi = document.getElementById("logoChi");
  const logoSpr = document.getElementById("logoSpr");

  function showErr(m) { errEl.textContent = m || ""; }
  function showOk(m) { okEl.textContent = m || ""; }
  function setCompact(t) { compactEl.textContent = t || ""; }
  function uniq(a) { return [...new Set(a)]; }

  /* IMPORTANT FIX: handle cached images */
  function wireLogo(img) {
    function show() { img.style.display = "inline-block"; }
    function hide() { img.style.display = "none"; }

    img.addEventListener("load", show);
    img.addEventListener("error", hide);

    if (img.complete && img.naturalWidth > 0) show();
  }

  wireLogo(logoChi);
  wireLogo(logoSpr);

  function normalizeToken(t) {
    if (!t) return null;
    t = t.toLowerCase();
    if (t === "b") return "b";
    if (/^[0-9][mps]$/.test(t)) return t;
    if (/^[1-7]z$/.test(t)) return t;
    return null;
  }

  function parseHand(input) {
    const raw = input.trim().toLowerCase();
    if (!raw) return [];

    function compactToTiles(str) {
      const out = [];
      let i = 0;
      while (i < str.length) {
        if (str[i] === "b") { out.push("b"); i++; continue; }
        let digits = "";
        while (/[0-9]/.test(str[i])) digits += str[i++];
        const suit = str[i++];
        for (const d of digits) out.push(normalizeToken(d + suit));
      }
      return out;
    }

    if (raw.includes("|")) {
      return raw.split("|").map(p => ({ tiles: compactToTiles(p.trim()) }));
    }

    return [{ tiles: compactToTiles(raw) }];
  }

  function tilesToCompact(groups) {
    return groups.map(g => {
      let out = "", suit = null, digits = "";
      function flush() { if (digits) out += digits + suit; digits=""; }
      for (const t of g.tiles) {
        if (t === "b") { flush(); out += "b"; continue; }
        if (suit === t[1]) digits += t[0];
        else { flush(); suit = t[1]; digits = t[0]; }
      }
      flush();
      return out;
    }).join(" | ");
  }

  const cache = new Map();

  function loadTile(k) {
    if (cache.has(k)) return Promise.resolve(cache.get(k));
    const img = new Image();
    img.src = `${TILE_DIR}/${k}.png`;
    return new Promise((res, rej) => {
      img.onload = () => { cache.set(k, img); res(img); };
      img.onerror = () => rej(new Error(`Missing tile: ${k}.png`));
    });
  }

  async function render(updateURL = true) {
    showErr(""); showOk("");

    const groups = parseHand(handEl.value);
    const compact = tilesToCompact(groups);
    setCompact(compact);

    if (updateURL) {
      const url = new URL(location.href);
      url.searchParams.set("hand", compact.replace(/\s\|\s/g, "|"));
      history.replaceState(null, "", url);
    }

    const flat = [];
    groups.forEach((g, i) => {
      g.tiles.forEach(t => flat.push({ t, sep:false }));
      if (i < groups.length - 1) flat.push({ sep:true });
    });

    const keys = uniq(flat.filter(x => x.t).map(x => x.t));
    await Promise.all(keys.map(loadTile));

    let h = Math.max(...keys.map(k => cache.get(k).height));
    let w = flat.reduce((a,x)=>a+(x.sep?GROUP_GAP:cache.get(x.t).width),0);

    const cv = document.getElementById("cv");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");

    let x = 0;
    for (const item of flat) {
      if (item.sep) { x += GROUP_GAP; continue; }
      const img = cache.get(item.t);
      ctx.drawImage(img, x, h - img.height);
      x += img.width;
    }
  }

  function exportPNG() {
    const a = document.createElement("a");
    a.download = "hand.png";
    a.href = document.getElementById("cv").toDataURL("image/png");
    a.click();
  }

  async function copyImage() {
    const cv = document.getElementById("cv");
    const blob = await new Promise(r => cv.toBlob(r));
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    showOk("Copied image to clipboard.");
  }

  document.getElementById("render").onclick = () => render(true);
  document.getElementById("export").onclick = exportPNG;
  document.getElementById("copy").onclick = copyImage;

  const params = new URLSearchParams(location.search);
  if (params.get("hand")) handEl.value = params.get("hand");
  render(false);
})();
</script>
</body>
</html>
